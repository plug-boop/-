name: US Deals Hunter 24/7

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Deal Hunter & Telegram Reply Processor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIN_DISCOUNT_PERCENT: "50"
          MAX_NEW_DEALS_PER_RUN: "8"
          CONTACT_HANDLE: "@y0uarecl0wn"
        run: python deal_hunter.py

      - name: Save seen deals state back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json
          git diff --staged --quiet || git commit -m "chore: update seen_deals.json [skip ci]"
          git push
